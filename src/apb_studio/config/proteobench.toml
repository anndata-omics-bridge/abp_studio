# What the fixture store fetches from ProteoBench.
#
# These change when ProteoBench adds a module or moves a results repository; they are not
# a property of this code, which is why they live here rather than in
# proteobench_fixtures.py. Adding a module is one [[modules]] block. Module definitions are
# not fetched: scoring workflows name apb-proteobench's packaged modules. Only each module's
# SDRF is, for exports that carry the sample design.

schema_version = 1
datasets_base_url = "https://proteobench.cubimed.rub.de/datasets/"

# The reference FASTAs, fetched as ZIPs and extracted into `fasta/`.
fasta_urls = [
  "https://proteobench.cubimed.rub.de/fasta/ProteoBenchFASTA_MixedSpecies_HYE.zip",
  "https://proteobench.cubimed.rub.de/fasta/ProteoBenchFASTA_MixedSpecies_HY.zip",
  "https://proteobench.cubimed.rub.de/fasta/ProteoBenchFASTA_Entrapment_Human_with_contaminants_entrapment_pep.zip",
  "https://proteobench.cubimed.rub.de/fasta/uniprotkb_proteome_UP000005640_2026_01_plus_contaminants-entrap.zip",
]

# Each module's SDRF, as apb-proteobench packages it: `<sdrf_base_url><name>.sdrf.tsv`,
# stored in `sdrf/`.
sdrf_base_url = "https://raw.githubusercontent.com/anndata-omics-bridge/apb-proteobench/main/src/apb_proteobench/data/modules/"

# One block per ProteoBench module.
#
# `name` is also the apb-proteobench packaged module name. `fasta` names which extracted
# FASTA the module uses: each module ships a single species mix, see ProteoBench's per-module docs
# under docs/modules/. This is the benchmark's reference, not a reconstruction of each
# submitter's search database. Different submitted databases can leave peptides unmatched.

[[modules]]
name = "dda_qexactive"
repo_url = "https://github.com/Proteobench/Results_quant_ion_DDA/archive/refs/heads/main.zip"
fasta = "ProteoBenchFASTA_MixedSpecies_HYE.fasta"

[[modules]]
name = "dda_astral"
repo_url = "https://github.com/Proteobench/Results_quant_ion_DDA_Astral/archive/refs/heads/main.zip"
fasta = "ProteoBenchFASTA_MixedSpecies_HYE.fasta"

[[modules]]
name = "dda_peptidoform"
repo_url = "https://github.com/Proteobench/Results_quant_peptidoform_DDA/archive/refs/heads/main.zip"
fasta = "ProteoBenchFASTA_MixedSpecies_HYE.fasta"

[[modules]]
name = "dia_astral"
repo_url = "https://github.com/Proteobench/Results_quant_ion_DIA_Astral/archive/refs/heads/main.zip"
fasta = "ProteoBenchFASTA_MixedSpecies_HYE.fasta"

[[modules]]
name = "dia_diapasef"
repo_url = "https://github.com/Proteobench/Results_quant_ion_DIA_diaPASEF/archive/refs/heads/main.zip"
fasta = "ProteoBenchFASTA_MixedSpecies_HYE.fasta"

[[modules]]
name = "dia_aif"
repo_url = "https://github.com/Proteobench/Results_quant_ion_DIA_AIF/archive/refs/heads/main.zip"
fasta = "ProteoBenchFASTA_MixedSpecies_HYE.fasta"

[[modules]]
name = "dia_zenotof"
repo_url = "https://github.com/Proteobench/Results_quant_ion_DIA_ZenoTOF/archive/refs/heads/main.zip"
# Confirmed 2026-10-08: https://proteobench.readthedocs.io/en/latest/modules/dia/dia-ion-zenotof/
fasta = "ProteoBenchFASTA_MixedSpecies_HYE.fasta"

# Single-cell DIA uses the HY (no E. coli) FASTA. The file inside the zip is misleadingly
# named *_DDAQuantification_noecoli.fasta; that is the HY mix.
[[modules]]
name = "dia_singlecell"
repo_url = "https://github.com/Proteobench/Results_quant_ion_DIA_singlecell/archive/refs/heads/main.zip"
fasta = "ProteoBenchFASTA_DDAQuantification_noecoli.fasta"

# Plasma DIA (PYE: human plasma with yeast and E. coli spike-ins) uses the HYE FASTA, as
# its module documentation specifies (confirmed 2026-10-08):
# https://proteobench.readthedocs.io/en/latest/modules/dia/dia-ion-plasma/
# Upstream scores it on other quantity columns than the quant modules; the hand-curated
# corpuses/proteobench_plasma.csv selects its submissions for scoring.
[[modules]]
name = "dia_plasma"
repo_url = "https://github.com/Proteobench/Results_quant_ion_DIA_plasma/archive/refs/heads/main.zip"
fasta = "ProteoBenchFASTA_MixedSpecies_HYE.fasta"

# Entrapment DIA (Astral) searches the peptide-level entrapment FASTA, as ProteoBench's
# module documentation asks; the protein-level entrapment FASTA is fetched too. Entrapment
# scoring differs from quant scoring; corpuses/proteobench_entrapment.csv selects its
# submissions.
[[modules]]
name = "entrapment_dia_astral"
repo_url = "https://github.com/Proteobench/Results_entrapment_ion_DIA_Astral/archive/refs/heads/main.zip"
fasta = "ProteoBenchFASTA_Entrapment_Human_with_contaminants_entrapment_pep.fasta"
