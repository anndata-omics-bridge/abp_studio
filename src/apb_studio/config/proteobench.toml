# Single-cell DIA uses the HY (no E. coli) FASTA. The file inside the zip is misleadingly
# named *_DDAQuantification_noecoli.fasta; that is the HY mix.
[[modules]]
name = "dia_singlecell"
repo_url = "https://github.com/Proteobench/Results_quant_ion_DIA_singlecell/archive/refs/heads/main.zip"
settings_path = "DIA/ion/lowinput/module_settings.toml"
