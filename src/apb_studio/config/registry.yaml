# Packaged stage registry — the single source of truth for Corpus Runner commands and topology.

stages:

  # APB2 appends .h5ad for a standalone level and .h5mu when level is omitted.
  - name: convert
    scope: dataset
    basket: converted
    output_pattern: "{module}/{dataset}/{branch}{suffix}"
    command: "apb2 convert {input} {level} --software {vendor} --params {params} --params-software {parameter_vendor} --output {output}"
    depends_on: []

  # Verify canonical modification-stripped peptide sequences against the FASTA database.
  - name: fasta
    scope: dataset
    basket: fasta checked
    container_agnostic: true
    output_pattern: "{module}/{dataset}/{branch}.fasta{suffix}"
    artifact: fasta
    command: "apb-fasta verify-peptides {input} {fasta} --output {output_path}"
    depends_on: [convert]
    resource: fasta
    branches: [mudata, ion, peptidoform, peptide, fragment]

  # Apply the existing apb-aggregate CLI once for each lower level that is actually available.
  - name: aggregate-ion
    scope: dataset
    basket: ion aggregated
    container_agnostic: true
    output_pattern: "{module}/{dataset}/{branch}.aggregate-ion{suffix}"
    artifact: aggregate-ion
    command: "apb-aggregate ion protein sum {input} {output_path}"
    depends_on: [fasta]
    branches: [mudata]
    requires_level: ion

  - name: aggregate-fragment
    scope: dataset
    basket: fragment aggregated
    container_agnostic: true
    output_pattern: "{module}/{dataset}/{branch}.aggregate-fragment{suffix}"
    artifact: aggregate-fragment
    command: "apb-aggregate fragment protein sum {input} {output_path}"
    depends_on: [aggregate-ion]
    branches: [mudata]
    requires_level: fragment

  # Attach the ProteoBench sample design and score it in one result-to-result call.
  - name: proteobench
    scope: dataset
    basket: proteobench scored
    container_agnostic: true
    output_pattern: "{module}/{dataset}/{branch}.proteobench{suffix}"
    artifact: proteobench
    command: "apb-proteobench benchmark {input} {module_settings} {output_path}"
    depends_on: [aggregate-fragment]
    resource: module_settings
    branches: [mudata, ion, peptidoform]

  # Single-call alternative: raw vendor table directly to one scored MuData result.
  - name: raw-proteobench
    scope: dataset
    basket: raw to proteobench
    output_pattern: "{module}/{dataset}/{branch}.raw-proteobench{suffix}"
    artifact: raw-proteobench
    command: "apb-proteobench run {input} {fasta} --params {params} --module {module_settings} --software {vendor} --params-software {parameter_vendor} --output {output_path}"
    depends_on: []
    resources: [fasta, module_settings]
    branches: [mudata]
