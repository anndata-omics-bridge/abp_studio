# Stage registry — the SINGLE SOURCE OF TRUTH for pipeline stages.
# Read by BOTH workflow/Snakefile and src/apb_studio/dashboard.py.
#
# Adding a pipeline step = one entry here + one Snakemake rule + one `apb` CLI subcommand.
# The dashboard re-derives its stage columns from this file.
#
# Fields:
#   name            stage id (also the Snakemake rule name, dashes→underscores)
#   scope           dataset | module | corpus
#   basket          compact dashboard column label after this stage runs
#   output_pattern  glob, relative to output_root; {placeholders} filled per dataset
#   artifact        output basename (no suffix) for a NON-root stage → f"{artifact}{suffix}"; the
#                   suffix tracks the dataset's convert artifact (.h5mu/.h5ad). The root (convert)
#                   omits it — pipeline.convert_artifact is authoritative for its name (decision 16).
#   command         the `apb` CLI template the Snakemake `shell:` runs (and the GUI previews)
#   depends_on      upstream stage names (a list); [] marks the root, which reads the raw dataset.
#                   pipeline.expand_targets derives each stage's INPUT edge from this (decision 5) —
#                   no hardcoded edges — and reconnects to the nearest emitted upstream (§13.1).
#   resource(s)     fixture resources consumed by this stage. ``resources`` supports commands
#                   that need more than one contract file.
#   branch_policy   ``module_level`` emits MuData plus the standalone level declared by the
#                   ProteoBench module TOML, excluding unrelated protein/fragment branches.
#   container_agnostic  operates on whatever object it's given (a level .h5ad or the .h5mu)
#
# These templates ARE the real `apb` CLI. Target expansion invokes convert once for MuData and once
# for every standalone level supported by APB's parsing-rule JSONs.

stages:

  # DAG root. The studio creates one no-level MuData target plus one --level target for every
  # standalone level returned by APB available_targets().
  - name: convert
    scope: dataset
    basket: converted
    output_pattern: "{module}/{dataset}/{branch}{suffix}"
    command: "apb convert {input} --software {vendor} --params {params} --output {output}"
    depends_on: []

  # Join sample annotations onto obs. Container-agnostic: takes the .h5mu (or a level .h5ad) and
  # one external annotation table; writes obs once. Gated on the module-level resource.
  - name: annotate
    scope: dataset
    basket: annotated
    container_agnostic: true
    output_pattern: "{module}/{dataset}/{branch}.annotated{suffix}"
    artifact: annotated
    command: "apb annotate {input} {annotation} --output {output}"
    depends_on: [convert]
    resource: annotation

  # FASTA validation for peptide-derived levels and protein annotation for protein levels.
  - name: fasta
    scope: dataset
    basket: fasta annotated
    container_agnostic: true
    output_pattern: "{module}/{dataset}/{branch}.fasta{suffix}"
    artifact: fasta
    command: "apb fasta {input} {fasta} --output {output}"
    depends_on: [convert]
    resource: fasta

  # Quantitative HYE scoring. The module TOML is the scoring/sample-design contract and the
  # per-tool TOML resolves the raw vendor columns retained by APB conversion. FASTA and sample
  # annotation are deliberately not prerequisites.
  - name: proteobench
    scope: dataset
    basket: proteobench scored
    container_agnostic: true
    branch_policy: module_level
    output_pattern: "{module}/{dataset}/{branch}.proteobench{suffix}"
    artifact: proteobench
    command: "apb proteobench {input} {module_settings} {tool_settings} --output {output}"
    depends_on: [convert]
    resources: [module_settings, tool_settings]
