[project]
name = "apb-studio"
version = "0.0.0"
description = "Corpus dashboard + Snakemake pipeline driving the anndata_proteomics (APB) conversion CLI."
requires-python = ">=3.10"
dependencies = [
    "snakemake>=8",
    "marimo",
    "pyyaml",
    "mudata",
    "anndata",
    # APB itself is consumed via its `apb` CLI (a sibling editable install in dev):
    #   uv pip install -e ../anndata_proteomics_bridge
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apb_studio"]
