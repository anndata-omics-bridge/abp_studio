[project]
name = "apb-studio"
version = "0.0.0"
description = "Corpus dashboard + Snakemake pipeline driving the anndata_proteomics (APB) conversion CLI."
requires-python = ">=3.13"
dependencies = [
    "snakemake>=8",
    "marimo",
    "pyyaml",
    "mudata",
    "anndata",
    # APB is consumed via its `apb` CLI (a sibling editable install in dev), not imported:
    #   uv pip install -e ../apb        # provides the `apb` CLI + the `anndata_proteomics` package
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apb_studio"]
