[project]
name = "apb-studio"
version = "0.0.0"
description = "Fixture Manager and Corpus Runner driving APB2 proteomics workflows."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Witold Wolski", email = "wew@fgcz.ethz.ch"}
]
dependencies = [
    "cyclopts",
    "loguru",
    "snakemake>=8",
    "pandas",
    "platformdirs>=4",
    "pydantic>=2",
    "psutil>=7",
    "requests",
    "beautifulsoup4",
    "pyarrow",
]

[tool.uv.sources]
apb-aggregate = { path = "../apb-aggregate", editable = true }
apb-fasta = { path = "../apb-fasta", editable = true }
apb-proteobench = { path = "../apb-proteobench", editable = true }
apb2 = { path = "../apb2", editable = true }
protein-fasta = { path = "../protein_fasta", editable = true }
carpet-scan = { git = "https://github.com/anndata-omics-bridge/carpet_scan.git", rev = "a98f45d21884a95fa79b7660b153bbadb9268e03" }

[project.optional-dependencies]
samples = [
    "apb2",
    "apb-aggregate",
    "apb-fasta",
    "apb-proteobench",
    "multiqc>=1.35,<1.36",
    "pmultiqc>=0.0.48,<0.1",
    "polars",
    "protein-fasta[cli]",
]
dev = [
    "apb-studio[samples]",
    # Carpet diagnostics; must live in Studio's own environment so grimp can import it.
    "carpet-scan",
    "anndata",
    "deptry>=0.25.1,<0.26",
    "diff-cover>=10.4,<11",
    "mudata",
    "numpy",
    "pandas-stubs",
    "pip-audit>=2.10,<3",
    "pre-commit>=4.5,<5",
    "pylint>=4.0.6",
    "pyright>=1.1.408,<2",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "ruff==0.15.12",
]

[dependency-groups]
docs = [
    "mkdocs-material>=9.7,<10",
]

[project.scripts]
corpus = "apb_studio.corpus.cli:main"
fixture = "apb_studio.proteobench_fixtures:main"

[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apb_studio"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
preview = true

[tool.ruff.lint]
explicit-preview-rules = true
select = [
    "A",
    "B",
    "C4",
    "C901",
    "E",
    "F",
    "I",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLC2701",
    "SLF001",
    "UP",
    "W",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["SLF001"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 7

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["src", "tests", "scripts"]
executionEnvironments = [
    { root = "tests", reportPrivateUsage = "none" },
    { root = "scripts", reportPrivateUsage = "none" },
    { root = "src" },
]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportImportCycles = "error"
reportMissingTypeStubs = "none"
reportUnnecessaryTypeIgnoreComment = "error"
reportImplicitOverride = "error"
enableTypeIgnoreComments = false
# PyArrow and scientific-library stubs propagate Unknown through
# otherwise fully annotated first-party code. Match APB's strict configuration:
# retain all concrete type errors while suppressing Unknown-only diagnostics.
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
reportUnknownParameterType = "none"
reportUnknownLambdaType = "none"

[tool.coverage.run]
branch = true
relative_files = true
source = ["apb_studio"]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_also = ["if __name__ == .__main__.:"]

[tool.deptry]
known_first_party = ["apb_studio"]
optional_dependencies_dev_groups = ["dev"]

[tool.deptry.per_rule_ignores]
# These tools are invoked through their executables and never imported by Studio.
DEP002 = ["apb-aggregate", "apb-fasta", "apb-proteobench", "multiqc", "pmultiqc", "protein-fasta", "snakemake"]

[tool.deptry.package_module_name_map]
pyyaml = "yaml"
