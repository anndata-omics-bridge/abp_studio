default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: [--fix]
        stages: [pre-commit]
      - id: ruff-format
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: pyright
        name: pyright (strict)
        entry: uv run --frozen --extra dev pyright
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]

      - id: deptry
        name: dependency declarations
        entry: uv run --frozen --extra dev deptry .
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]

      - id: forbid-type-checker-ignores
        name: forbid type-checker ignore comments
        entry: '#\s*(type:\s*ignore|pyright:\s*ignore)'
        language: pygrep
        types: [python]
        stages: [pre-commit]

      - id: pytest-coverage
        name: tests and branch coverage
        entry: >-
          uv run --frozen --extra dev pytest
          --cov=apb_studio
          --cov-branch
          --cov-report=xml:coverage.xml
          --cov-report=term-missing
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]

      - id: diff-cover
        name: changed-line coverage
        entry: uv run --frozen --extra dev python scripts/diff_coverage.py
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]

      - id: package-smoke
        name: package smoke
        entry: uv run --frozen --extra dev python scripts/package_smoke.py
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]

      - id: mkdocs-strict
        name: strict documentation build
        entry: uv run --frozen --group docs mkdocs build --strict
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]

      # Report-only. Never blocks, never fails: a number flags a module for triage, it does not
      # adjudicate one. Runs in Studio's own environment, not an isolated `uvx` one, because grimp
      # resolves the target package through the Python path.
      #
      # Only three of the five checks are available here: pyan3 2.6.2 raises
      # `ValueError: Unknown scope '...listcomp.0.lambda.0'` on the lambda inside a list
      # comprehension in `pipeline/render_command.py`, which kills the public-surface and
      # call-depth tables. Vulture, radon, ruff and grimp still run. Do not rewrite that lambda to
      # please the tool -- that is restructuring to satisfy a diagnostic, which the workspace rules
      # forbid; the bug is upstream.
      - id: carpet-scan
        name: carpet diagnostics (dead code, private access, folder depth)
        entry: >-
          uv run --frozen --extra dev
          carpet-scan src --tests tests --html build/carpet-report.html
        language: system
        always_run: true
        pass_filenames: false
        # Always print the report: pre-commit hides passing hooks' output, and this hook always
        # passes by design, so without this it would never show anything.
        verbose: true
        stages: [manual]

      - id: dependency-audit
        name: dependency vulnerability audit
        entry: >-
          uv run --frozen --extra dev
          pip-audit --local --skip-editable --progress-spinner=off
        language: system
        always_run: true
        pass_filenames: false
        stages: [manual]
