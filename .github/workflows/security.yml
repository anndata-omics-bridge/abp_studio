name: security

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apb_studio
    steps:
      - name: Checkout APB Studio
        uses: actions/checkout@v7
        with:
          path: apb_studio

      - name: Checkout pinned APB
        uses: actions/checkout@v7
        with:
          repository: anndata-omics-bridge/anndata-proteomics-bridge
          ref: ec6668257b3229ee704b350ddf98a71f4a4d1cdf
          path: apb

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Sync locked environment
        run: uv sync --frozen --extra dev

      - name: Audit dependencies
        run: uv run --no-sync pre-commit run dependency-audit --hook-stage manual --all-files
