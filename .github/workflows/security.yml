name: security

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apb_studio
    steps:
      - name: Checkout APB Studio
        uses: actions/checkout@v7
        with:
          path: apb_studio

      # Siblings install from ../<path> through tool.uv.sources, including those of apb-fasta
      # and apb-proteobench; bump these revisions together with uv.lock.
      - name: Checkout APB2
        uses: actions/checkout@v7
        with:
          repository: anndata-omics-bridge/apb2
          ref: 293b5c8e1d86f2b4cd66aaf683d2b4367ff47fe8
          path: apb2

      - name: Checkout apb-catalog
        uses: actions/checkout@v7
        with:
          repository: anndata-omics-bridge/apb-catalog
          ref: 1faa8f33e28dcb5eef01d5367b9ebce6e1e61d10
          path: apb-catalog

      - name: Checkout apb-fasta
        uses: actions/checkout@v7
        with:
          repository: anndata-omics-bridge/apb-fasta
          ref: ac40f0d80582a5a78bbc7b0f3ef00c9ec747da87
          path: apb-fasta

      - name: Checkout apb-proteobench
        uses: actions/checkout@v7
        with:
          repository: anndata-omics-bridge/apb-proteobench
          ref: 0f0444ab4568b7175963ac7135c17b9fe7ad1d26
          path: apb-proteobench

      - name: Checkout protein-fasta
        uses: actions/checkout@v7
        with:
          repository: anndata-omics-bridge/protein-fasta
          ref: 4048b16bcce895ca5d7a774d2ec0c11bb9bd34e2
          path: protein_fasta

      - name: Checkout Prozor
        uses: actions/checkout@v7
        with:
          repository: anndata-omics-bridge/prozor
          ref: ab7c41bdfbbe877d66236c5c33549b7747426ace
          path: prozor

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Sync locked environment
        run: uv sync --frozen --extra dev

      - name: Audit dependencies
        run: uv run --no-sync pre-commit run dependency-audit --hook-stage manual --all-files
