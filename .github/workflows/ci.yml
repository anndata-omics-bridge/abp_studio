name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apb_studio
    env:
      DIFF_COVER_BASE: ${{ github.base_ref && format('origin/{0}', github.base_ref) || 'main' }}
    steps:
      - name: Checkout APB Studio
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: apb_studio

      # Siblings install from ../<path> through tool.uv.sources, including those of apb-fasta
      # and apb-proteobench; each is checked out at its current main.
      - name: Checkout APB2
        uses: actions/checkout@v7
        with:
          repository: anndata-omics-bridge/apb2
          path: apb2

      - name: Checkout apb-catalog
        uses: actions/checkout@v7
        with:
          repository: anndata-omics-bridge/apb-catalog
          path: apb-catalog

      - name: Checkout apb-fasta
        uses: actions/checkout@v7
        with:
          repository: anndata-omics-bridge/apb-fasta
          path: apb-fasta

      - name: Checkout apb-proteobench
        uses: actions/checkout@v7
        with:
          repository: anndata-omics-bridge/apb-proteobench
          path: apb-proteobench

      - name: Checkout protein-fasta
        uses: actions/checkout@v7
        with:
          repository: anndata-omics-bridge/protein-fasta
          path: protein_fasta

      - name: Checkout Prozor
        uses: actions/checkout@v7
        with:
          repository: anndata-omics-bridge/prozor
          path: prozor

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, matching proptm3d
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apb_studio/viewer/package-lock.json

      - name: Install locked viewer dependencies
        run: npm ci --prefix viewer

      - name: Sync locked environment
        run: uv sync --frozen --extra dev --group docs

      - name: Run pre-commit checks
        run: uv run --no-sync pre-commit run --hook-stage pre-commit --all-files

      - name: Run pre-push checks
        run: uv run --no-sync pre-commit run --hook-stage pre-push --all-files
