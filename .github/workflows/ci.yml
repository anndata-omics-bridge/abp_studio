name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apb_studio
    env:
      DIFF_COVER_BASE: ${{ github.base_ref && format('origin/{0}', github.base_ref) || 'main' }}
    steps:
      - name: Checkout APB Studio
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: apb_studio

      # Siblings install from ../<path> through tool.uv.sources, including those of apb-aggregate,
      # apb-fasta and apb-proteobench; bump these revisions together with uv.lock.
      - name: Checkout APB2
        uses: actions/checkout@v7
        with:
          repository: anndata-omics-bridge/apb2
          ref: 293b5c8e1d86f2b4cd66aaf683d2b4367ff47fe8
          path: apb2

      - name: Checkout apb-aggregate
        uses: actions/checkout@v7
        with:
          repository: anndata-omics-bridge/apb-aggregate
          ref: 15f40c55c2c8ccd5398947cd16662369bc3c50f8
          path: apb-aggregate
          # Private repository: a read-only token for apb-aggregate's contents.
          token: ${{ secrets.APB_AGGREGATE_TOKEN }}

      - name: Checkout apb-catalog
        uses: actions/checkout@v7
        with:
          repository: anndata-omics-bridge/apb-catalog
          ref: 1faa8f33e28dcb5eef01d5367b9ebce6e1e61d10
          path: apb-catalog

      - name: Checkout apb-fasta
        uses: actions/checkout@v7
        with:
          repository: anndata-omics-bridge/apb-fasta
          ref: ac40f0d80582a5a78bbc7b0f3ef00c9ec747da87
          path: apb-fasta

      - name: Checkout apb-proteobench
        uses: actions/checkout@v7
        with:
          repository: anndata-omics-bridge/apb-proteobench
          ref: 0f0444ab4568b7175963ac7135c17b9fe7ad1d26
          path: apb-proteobench

      - name: Checkout protein-fasta
        uses: actions/checkout@v7
        with:
          repository: anndata-omics-bridge/protein-fasta
          ref: 4048b16bcce895ca5d7a774d2ec0c11bb9bd34e2
          path: protein_fasta

      - name: Checkout Prozor
        uses: actions/checkout@v7
        with:
          repository: anndata-omics-bridge/prozor
          ref: ab7c41bdfbbe877d66236c5c33549b7747426ace
          path: prozor

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Sync locked environment
        run: uv sync --frozen --extra dev --group docs

      - name: Run pre-commit checks
        run: uv run --no-sync pre-commit run --hook-stage pre-commit --all-files

      - name: Run pre-push checks
        run: uv run --no-sync pre-commit run --hook-stage pre-push --all-files
